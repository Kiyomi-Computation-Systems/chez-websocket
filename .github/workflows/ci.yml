name: CI

# Linux only, deliberately (AGENTS.md: do NOT set up macOS runners). macOS is
# the development platform and is exercised by `make test` locally. Each job
# builds chez-libuv's shim against system libuv and resolves the pinned
# chez-http-server and the pins it carries onto one library path, by the setup
# action beside this file (.github/actions/setup). `linux` then runs the suite:
# chez-http-server's job without that project's test clients. `autobahn` runs
# the Autobahn lane, `make autobahn`, beside it, on every PR and push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # A run by hand with a salt misses the Chez cache, so the setup action's
      # build-and-save path runs: proven now, not at the next floor or image
      # bump. A push or a PR has none, and the key is the cache's usual one.
      chez-cache-salt:
        description: "Appended to the Chez cache key, to run its miss path"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Chez floor. Each job asserts the Chez it ends up with actually meets
# this rather than trusting the resolution step.
env:
  CHEZ_FLOOR_VERSION: "10.4.1"

jobs:
  linux:
    name: linux
    # An explicit image, not ubuntu-latest, as chez-http-server's: an image
    # change should be a reviewed commit. Changing it re-keys the Chez cache
    # (the setup action's OS release).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # This repository alone, with the job's own token; the setup action's
      # `make submodules` clones the submodules.
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          chez-cache-salt: ${{ inputs.chez-cache-salt }}

      - name: Test
        run: make test

      - name: Check help is complete
        run: make check-help

      # The docs site: the fetch script's offline test, then the generator's
      # suites and docs/ rendered in memory, so a broken link or anchor fails
      # here, before the Pages workflow publishes it.
      - name: Docs site
        run: |
          make check-site-deps
          make check-site

  autobahn:
    name: autobahn
    # Autobahn's image is built for linux/amd64 alone, which this runner is,
    # so it runs natively here. Docker is on the image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          chez-cache-salt: ${{ inputs.chez-cache-salt }}

      # The fuzzing client's 301 cases against tests/autobahn/echo.sps, gated
      # on tests/autobahn/verdicts.txt, both ways.
      - name: Autobahn lane
        run: make autobahn

      # A verdict that moved is read from the run's own reports.
      - name: Keep the run's reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-reports
          path: build/autobahn
          retention-days: 14
